services:
  opencode:
    # 镜像由 GitHub Actions 构建推送到 GHCR：把 OWNER 换成你的 GitHub 用户名/组织
    image: ghcr.io/OWNER/opencode-docker:latest
    container_name: opencode-remote
    restart: unless-stopped
    # 不发布任何端口：远程访问只走 OpenTunnel 端到端加密隧道
    volumes:
      # 项目代码工作区（改成你的实际代码目录）
      - ./workspace:/workspace
      # 会话 / 数据库 / auth 凭据持久化
      - opencode-data:/home/opencode/.local/share/opencode
    working_dir: /workspace

volumes:
  opencode-data:
