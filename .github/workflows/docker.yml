name: docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
  # 关闭 buildx 默认 provenance attestation（attestation 是 OCI artifact，阿里云个人版仓库不支持，GHCR 支持）
  BUILDX_NO_DEFAULT_ATTESTATIONS: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 优先用 PAT；未配置时回退 GITHUB_TOKEN（本仓库 package 已由 CI 创建并关联，可直接推送）
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun ACR
        if: github.event_name != 'pull_request' && env.ALIYUN_PASSWORD != ''
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: hustme
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      # GHCR 与阿里云的标签必须一起推（多行 tags）。早期写法用第二次 echo 覆盖同名输出，
      # 结果只推了阿里云，GHCR 的 latest 一直停在旧镜像上，需要两个标签都保留。
      - name: 计算镜像标签
        id: tags
        run: |
          tags="${{ steps.meta.outputs.tags }}"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "${ALIYUN_PASSWORD}" ]; then
            tags="${tags}"$'\n'"registry.cn-hangzhou.aliyuncs.com/jiangood/opencode-docker:latest"
          fi
          {
            echo 'tags<<EOF'
            printf '%s\n' "${tags}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "本次推送标签："; printf '%s\n' "${tags}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # 不传 platforms：单平台 amd64 直接推 Docker schema2 manifest（阿里云个人版仓库不支持 OCI manifest）；
          # amd64-only 由 Dockerfile 内的 TARGETARCH 断言保证
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
