name: docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 优先用 PAT；未配置时回退 GITHUB_TOKEN（本仓库 package 已由 CI 创建并关联，可直接推送）
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun ACR
        if: github.event_name != 'pull_request' && env.ALIYUN_PASSWORD != ''
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: hustme
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: 计算镜像标签
        id: tags
        run: |
          echo "tags=${{ steps.meta.outputs.tags }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "${ALIYUN_PASSWORD}" ]; then
            echo "tags=registry.cn-hangzhou.aliyuncs.com/jiangood/opencode-docker:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # 不传 platforms：单平台 amd64 直接推 Docker schema2 manifest（阿里云个人版仓库不支持 OCI manifest）；
          # amd64-only 由 Dockerfile 内的 TARGETARCH 断言保证
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
